
name: Build Auto BT Speaker Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        working-directory: Auto-BT-Speaker-Lock
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto-BT-Speaker-Lock-APK
          path: Auto-BT-Speaker-Lock/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
